[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-upgrader"
version = "0.1.0"
description = "Local-first Markdown wiki upgrader for LLM notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLM Wiki Upgrader contributors" }]
keywords = ["llm", "wiki", "markdown", "documentation", "codex"]

[project.scripts]
llm-wiki-upgrader = "llm_wiki_upgrader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_wiki_upgrader*"]
